<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Software Oscilloscope</title>
    <style>
        body {
            margin: 0;
            background: #444444;
            color: #eee;
            font-family: monospace;
            overflow-y: scroll;
            scrollbar-gutter: stable;
        }

        #id_control_panel {
            border: 1px dashed rgb(118, 118, 223);

        #scope_panel canvas {
            display: block;
            visibility: hidden;

            margin: 10px;
        }
    </style>
</head>

<body>
    <h1>Software Oscilloscope</h1>
    <p id="id_above_panel"></p>
    <div id="id_control_panel"></div>
    <div id="id_scope_panel"></div>
    <script src="./dist/app.js"></script>
</body>

</html>
