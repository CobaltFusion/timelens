[project]
name = "timelens"
version = "0.1.0"

dependencies = [
    "fastapi",
    "watchfiles",
    "uvicorn",
    "websockets",
    "psutil",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "playwright",
]

[tool.pytest.ini_options]
markers = [
    "integration: a test with a real server and a browser, see tests/integration (slower)",
]
