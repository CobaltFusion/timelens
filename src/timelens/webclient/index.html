<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TimeLens Server Discovery</title>

    <style>
        :root {
            color-scheme: dark;
            --bg: #080b12;
            --card: #101620;
            --hover: #151e2b;
            --border: #263244;
            --text: #e8edf5;
            --muted: #8996a8;
            --accent: #35d0ba;
            --error: #ff5577;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 3rem 1rem;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, sans-serif;
        }

        main {
            width: min(1100px, 100%);
            margin: auto;
        }

        h1 {
            margin: 0 0 .4rem;
            font-size: 2rem;
            letter-spacing: -.04em;
        }

        p {
            margin: 0 0 1.5rem;
            color: var(--muted);
        }

        #servers {
            display: grid;
            gap: .5rem;
        }

        .server {
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr 2fr auto;
            gap: 1.5rem;
            align-items: center;
            padding: .8rem 1rem;
            border: 1px solid var(--border);
            border-radius: .6rem;
            background: var(--card);
            color: inherit;
            text-decoration: none;
            transition: .15s;
        }

        .server:hover {
            background: var(--hover);
            border-color: var(--accent);
            transform: translateX(2px);
        }

        .name {
            font-weight: 650;
        }

        .value {
            overflow: hidden;
            color: var(--muted);
            font: .8rem monospace;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .ip {
            color: var(--accent);
        }

        .arrow {
            color: var(--muted);
            font-size: 1.1rem;
        }

        .empty,
        .error {
            padding: 1.5rem;
            border: 1px dashed var(--border);
            border-radius: .6rem;
            color: var(--muted);
            text-align: center;
        }

        .error {
            color: var(--error);
        }

        @media (max-width: 700px) {
            .server {
                grid-template-columns: 1fr auto;
                gap: .4rem 1rem;
            }

            .server .value {
                grid-column: 1;
            }

            .server .arrow {
                grid-column: 2;
                grid-row: 1 / span 2;
            }
        }
    </style>
</head>

<body>
    <main>
        <p>Servers discovered on the local network</p>

        <div id="servers">
            <div class="empty">Discovering servers...</div>
        </div>
    </main>

    <script>
        async function discoverServers() {
            const container = document.getElementById("servers");

            try {
                const response = await fetch("/api/servers");

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                container.replaceChildren();

                if (!data.servers?.length) {
                    showMessage(container, "No TimeLens servers found.");
                    return;
                }

                for (const server of data.servers) {
                    const link = document.createElement("a");

                    link.className = "server";
                    link.href =
                        `http://${server.address}:${server.port}/graph.html`;

                    link.innerHTML = `
                        <span class="name">${server.name}</span>
                        <span class="value">${server.address}:${server.port}</span>
                        <span class="value">${server.subnet}</span>
                        <span class="value">${server.instance_id}</span>
                    `;

                    container.appendChild(link);
                }
            } catch (error) {
                console.error(error);
                container.replaceChildren();
                showMessage(
                    container,
                    `Failed to discover servers: ${error.message}`,
                    true
                );
            }
        }

        function showMessage(container, message, error = false) {
            const element = document.createElement("div");
            element.className = error ? "error" : "empty";
            element.textContent = message;
            container.appendChild(element);
        }

        discoverServers();
    </script>
</body>

</html>
